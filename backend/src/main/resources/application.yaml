bank:
  host:
    baseurl: http://${BANK_WITH_PORT:localhost:9090}

# Property to set the visible level on all logs (OFF will turn off all of them)
# logging:
#   level:
#     root: OFF

springdoc:
  swagger-ui:
    path: /doc

# postgres DB # IN DOCKER COMPOSE SHOULD BE OVERRIDEN BY ENV VARIABLES

spring:
  datasource:
    # POSTGRES_USER
    username: postgresuser
    # POSTGRES_PASSWORD
    password: postgrespass
    url: jdbc:postgresql://${POSTGRES_HOST}/tcf-db
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    generate-ddl: true
    open-in-view: false
